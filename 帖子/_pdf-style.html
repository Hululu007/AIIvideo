<style>
  @page { size: A4; margin: 18mm 16mm 18mm 16mm; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Songti SC", sans-serif;
    font-size: 10.5pt; line-height: 1.75; color: #1a1a1a;
    max-width: none; margin: 0;
  }
  h1 { font-size: 20pt; margin: 0 0 6pt; letter-spacing: -0.5pt; }
  h2 { font-size: 14pt; margin: 22pt 0 8pt; padding-bottom: 4pt; border-bottom: 1.5pt solid #e5e7eb; }
  h3 { font-size: 11.5pt; margin: 16pt 0 6pt; }
  p { margin: 6pt 0; }
  strong { color: #000; }
  code {
    font-family: "SF Mono", Menlo, monospace; font-size: 9pt;
    background: #f3f4f6; padding: 1pt 4pt; border-radius: 3pt;
  }
  pre {
    background: #f8f9fa; border-left: 3pt solid #d1d5db;
    padding: 8pt 10pt; margin: 8pt 0; font-size: 9pt; overflow-wrap: anywhere;
  }
  pre code { background: none; padding: 0; }
  img { display: block; max-height: 600pt; max-width: 100%; margin: 10pt auto; border: 0.5pt solid #e5e7eb; page-break-inside: avoid; }
  p:has(> img) { margin: 4pt 0; text-align: center; }
  hr { border: none; border-top: 1pt solid #e5e7eb; margin: 20pt 0; }
  table { border-collapse: collapse; width: 100%; margin: 8pt 0; font-size: 9.5pt; }
  th, td { border: 0.5pt solid #d1d5db; padding: 4pt 6pt; text-align: left; }
  th { background: #f3f4f6; }
  ul, ol { margin: 6pt 0; padding-left: 18pt; }
  li { margin: 3pt 0; }
  a { color: #2563eb; text-decoration: none; }
</style>
