{% extends "base.html" %}
{% block title %}我的账号 · AIIvideo 后台{% endblock %}
{% block body %}
<h1>我的账号</h1>
<p class="muted">当前登录：{{ session.username }}</p>
<form class="stack" method="post" action="{{ mount }}/account/password">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>原口令<input name="old" type="password" autocomplete="current-password"></label>
  <label>新口令<input name="new" type="password" autocomplete="new-password"></label>
  <label>再输一次<input name="repeat" type="password" autocomplete="new-password"></label>
  <div class="row"><button type="submit">更新口令</button></div>
</form>
{% endblock %}
