<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512" role="img" aria-label="AIIvideo">
  <title>AIIvideo 图标</title>
  <desc>白色圆底，居中一个黑色的 A。画布 108×108 与 Android 自适应图标一致；A 收在中心半径 34 以内，圆形、方形、圆角方形三种蒙版下都不会被裁掉。</desc>

  <!-- 白色圆底 -->
  <circle cx="54" cy="54" r="54" fill="#ffffff"/>

  <!-- 黑色 A。三段同色图形拼出来，不用挖洞：
       两条斜杠在顶部共用同一段横边，自然形成平顶；
       横杠是梯形，左右腰贴着斜杠的外沿，接上去没有缝；
       于是上半部的三角字腔和下半部的开裆都是"没画"画出来的。
       笔画水平厚度 10.5，整体 50 宽 52 高，中心 (54,54)。 -->
  <g fill="#000000">
    <path d="M48.75 29 L59.25 29 L39.5 81 L29 81 Z"/>
    <path d="M48.75 29 L59.25 29 L79 81 L68.5 81 Z"/>
    <path d="M36.22 62 L71.78 62 L75.58 72 L32.42 72 Z"/>
  </g>
</svg>
