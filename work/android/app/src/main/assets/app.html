<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f2e9" id="theme-color">
  <title>AIIvideo</title>
  <script>
    /* 主题要在 CSS 之前定下来。放到 app.js 里会先画一帧浅色再翻成深色，
       冷启动的闪白在 OLED 上特别明显。这里只读偏好、算一次，不碰任何 DOM。 */
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('hgpref:theme') || 'system'; } catch (error) {}
      if (mode !== 'light' && mode !== 'dark') mode = 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.themePref = mode;
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="app-top">
      <button id="account-avatar" class="account-avatar" type="button" aria-label="登录账号">
        <img class="account-avatar-default" src="user.svg" alt="">
        <img id="account-avatar-image" alt="" hidden>
      </button>
      <form id="search-form" class="search-form" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
        <input id="search-input" class="search-input" type="search" placeholder="搜索剧名或 #标签" autocomplete="off" aria-label="搜索剧名或标签">
      </form>
      <button id="header-settings" class="header-settings" type="button" aria-label="设置" hidden><img src="settings.svg" alt=""></button>
    </header>
    <main id="scroll"><div id="content"></div></main>
    <div id="compact-category" aria-hidden="true"></div>
    <nav id="dock" aria-label="主导航">
      <button type="button" data-nav="home" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span>首页</span></button>
      <button type="button" data-nav="adult"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 5l3 5m3-5 3 5"/></svg></span><span>剧场</span></button>
      <button type="button" data-nav="ai"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8zM19 17l.6 1.4L21 19l-1.4.6L19 21l-.6-1.4L17 19l1.4-.6z"/></svg></span><span>AI</span></button>
      <button type="button" data-nav="library"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21c.5-4.3 3-6.5 7.5-6.5s7 2.2 7.5 6.5"/></svg></span><span>我的</span></button>
    </nav>
    <div id="toast-host" role="status" aria-live="polite"></div>
    <div id="auth-overlay" hidden>
      <section class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <button id="auth-close" class="auth-close" type="button" aria-label="关闭">×</button>
        <h2 id="auth-title">登录应用账号</h2>
        <p>登录后同步收藏和观看历史</p>
        <div class="auth-tabs" role="tablist"><button type="button" data-auth-mode="login" class="selected">登录</button><button type="button" data-auth-mode="register">注册</button></div>
        <form id="auth-form">
          <label for="auth-username">账号</label><input id="auth-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="24" required placeholder="字母、数字或下划线">
          <label for="auth-password">密码</label><input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="至少 8 位">
          <p id="auth-error" class="auth-error" role="alert" hidden></p>
          <button id="auth-submit" class="auth-submit" type="submit" aria-live="polite">登录</button>
        </form>
        <p class="auth-footnote">忘记密码请联系管理员重置。</p>
      </section>
    </div>
    <div id="unlock-overlay" hidden>
      <section class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="unlock-title">
        <button id="unlock-close" class="auth-close" type="button" aria-label="关闭">×</button>
        <h2 id="unlock-title">验证访问密码</h2>
        <form id="unlock-form">
          <label for="unlock-password">密码</label>
          <input id="unlock-password" type="password" autocomplete="off" required>
          <p id="unlock-error" class="auth-error" role="alert" hidden></p>
          <button class="auth-submit" type="submit">进入</button>
        </form>
      </section>
    </div>
    <div id="confirm-overlay" hidden>
      <section class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <div class="confirm-buttons"><button id="confirm-cancel" type="button">取消</button><button id="confirm-accept" type="button">清空</button></div>
      </section>
    </div>
  </div>

  <div id="setup-overlay" hidden>
    <section class="setup-panel" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <div class="setup-symbol">A</div>
      <h1 id="setup-title">设置源</h1>
      <p class="setup-lead">这个应用不自带任何内容源。填一个配置地址才能开始使用。</p>
      <div id="setup-market" class="setup-market" hidden></div>
      <button id="setup-market-apply" type="button" class="setup-market-apply" hidden disabled>先勾选至少一个源</button>
      <input id="setup-input" type="url" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://example.com/source.json">
      <p id="setup-hint" class="setup-hint">地址必须以 https:// 开头</p>
      <p id="setup-error" class="setup-error" role="alert" hidden></p>
      <button id="setup-submit" type="button">获取并应用</button>
    </section>
  </div>

  <div id="age-gate" hidden>
    <div class="age-panel" role="dialog" aria-modal="true" aria-labelledby="age-title">
      <div class="age-symbol">18+</div>
      <h1 id="age-title">请确认你的年龄</h1>
      <p>本应用展示成人内容，仅供已达到所在地法定年龄的用户使用。</p>
      <button id="age-confirm" type="button">我已年满 18 周岁</button>
      <button id="age-exit" type="button">退出应用</button>
    </div>
  </div>
  <script src="vendor/rematrix-0.2.2.js"></script>
  <script src="vendor/flip-toolkit-7.2.6.js"></script>
  <script src="card-transition.js"></script>
  <script src="runtime.js"></script>
  <script src="site-web.js"></script>
  <script src="setup.js"></script>
  <script src="feed-player.js"></script>
  <script src="cover.js"></script>
  <script src="adapters.js"></script>
  <!-- AGE动漫 播放层：wasm 加解密 + 走 Java 桥的 HTTP。顺序不能换 ——
       hxm-exec 定义 Go，hxm.wasm 提供字节，md5 推导密钥，http 是网络出口，agedm-play 串起来。 -->
  <script src="hxm/hxm-exec.js"></script>
  <script src="hxm/hxm.wasm.js"></script>
  <script src="hxm/md5.js"></script>
  <script src="hxm/hxm.js"></script>
  <script src="hxm/http.js"></script>
  <script src="hxm/agedm-play.js"></script>
  <!-- 从 app.js 拆出来的三块。都只在被调用时才碰 DOM 和状态，加载顺序只需要在
       app.js 之前，和 cover.js / adapters.js 一个做法：靠全局作用域通信。 -->
  <script src="app-update.js"></script>
  <script src="source-market.js"></script>
  <script src="proxy-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
